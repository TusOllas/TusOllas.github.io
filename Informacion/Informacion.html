<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TusOllas/Información Producto</title>

    <link rel="stylesheet" href="Informacion.css">

</head>
<body>



    <!-- ===================================================== -->
    <!-- MENU SUPERIOR                                         -->
    <!-- ===================================================== -->

    <iframe
        src="../Menu/Menu.html"
        class="iframe-menu"
        frameborder="0">
    </iframe>



    <!-- ===================================================== -->
    <!-- CONTENEDOR PRINCIPAL                                  -->
    <!-- ===================================================== -->

    <section class="contenedor-informacion">



        <!-- ===================================================== -->
        <!-- COLUMNA IZQUIERDA                                     -->
        <!-- ===================================================== -->

        <div class="columna-imagenes">



            <!-- IMAGEN PRINCIPAL -->

            <div class="caja-imagen-principal">

                <img
                    id="imagen-principal"
                    class="imagen-principal"
                >

                <div
                    class="precio-producto"
                    id="precio-producto">
                </div>

            </div>



            <!-- MINI IMAGENES -->

            <div class="mini-imagenes">

                <img
                    id="mini-imagen-1"
                    class="mini-imagen"
                >

                <img
                    id="mini-imagen-2"
                    class="mini-imagen"
                >

                <img
                    id="mini-imagen-3"
                    class="mini-imagen"
                >

            </div>

        </div>



        <!-- ===================================================== -->
        <!-- COLUMNA DERECHA                                       -->
        <!-- ===================================================== -->

        <div class="columna-info">



            <!-- MARCA -->

            <p
                class="texto-light"
                id="marca-producto">
            </p>



            <!-- NOMBRE -->

            <h1
                class="nombre-producto"
                id="nombre-producto">
            </h1>



            <!-- LINEA -->

            <div class="linea"></div>



            <!-- DESCRIPCION -->

            <p class="texto-light">

                DESCRIPCIÓN

            </p>



            <p
                class="descripcion-producto"
                id="descripcion-producto">
            </p>



            <!-- BOTON -->

            <button id="boton-carrito"
            class="boton-carrito">

            AGREGAR AL CARRITO

            </button>


        <!-- ===================================================== -->
        <!-- MENSAJE                                               -->
        <!-- ===================================================== -->

            <div id="mensaje-carrito"
                class="mensaje-carrito">

                Producto agregado al carrito correctamente

            </div>


        </div>



        <!-- ===================================================== -->
        <!-- DETALLES                                              -->
        <!-- ===================================================== -->

        <div class="detalles-producto">



            <div class="columna-detalles">



                <p class="texto-light">

                    DETALLES

                </p>



                <div
                    class="texto-detalles"
                    id="detalles-producto">
                </div>

            </div>



            <!-- LINEA VERTICAL -->

            <div class="linea-vertical"></div>



            <!-- COLORES -->

            <div class="columna-colores">



                <p class="texto-colores">

                    COLORES

                </p>



                <select
                    class="lista-colores"
                    id="lista-colores">
                </select>

            </div>

        </div>

    </section>



    <script src="informacion.js"></script>

</body>
</html>
