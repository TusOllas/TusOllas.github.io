<!DOCTYPE html>
<html lang="es">
<head>

</head>
<body>



    <!-- ===================================================== -->

    <!-- ===================================================== -->

    <iframe

        class="iframe-menu"
        frameborder="0">
    </iframe>



    <!-- ===================================================== -->
    <!-- CONTENEDOR                                            -->
    <!-- ===================================================== -->

    <section class="contenedor-carrito">

        <h1 class="titulo-carrito">

        <div class="linea-carrito"></div>



        <!-- PRODUCTOS -->

        <div id="productos-carrito">

        </div>



        <!-- BOTON -->

        <button
            class="boton-pedido"
            onclick="abrirPedido()">

            HACER PEDIDO

        </button>

    </section>



    <!-- ===================================================== -->
    <!-- JAVASCRIPT                                            -->
    <!-- ===================================================== -->

    <script src="../Productos/Productos.js"></script>

    <script src="Carrito.js"></script>
